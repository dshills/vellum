name: Framework
on: [push, pull_request]
jobs:
  framework:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - run: drivers/cogent/prepare.sh
      - run: scripts/check.sh
