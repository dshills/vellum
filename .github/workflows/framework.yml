name: Framework
on: [push, pull_request]
jobs:
  framework:
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Record job start for optional cache budget
        run: echo "VELLUM_CI_STARTED=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: echo "VELLUM_CACHE_DIR=$RUNNER_TEMP/vellum-go-cache" >> "$GITHUB_ENV"
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Restore verified downloads and Go build cache
        id: go-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ runner.temp }}/vellum-go-cache/mod/cache/download
            ${{ runner.temp }}/vellum-go-cache/build
          key: vellum-framework-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/go.mod', '**/go.sum', 'drivers/cogent/native/dependencies.json', 'release/native-patch-inventory.json') }}-${{ github.sha }}
          restore-keys: |
            vellum-framework-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/go.mod', '**/go.sum', 'drivers/cogent/native/dependencies.json', 'release/native-patch-inventory.json') }}-
      - name: Rebuild and verify pinned native sources
        run: drivers/cogent/prepare.sh
      - name: Verify downloaded module contents
        shell: bash
        run: |
          . ./drivers/cogent/env.sh
          go mod verify
          (cd drivers/cogent && go mod verify)
      - name: Tooling and packaging regressions
        run: scripts/check.sh --stage tooling
      - name: Portable framework race tests and vet
        run: scripts/check.sh --stage portable
      - name: Native facade race tests vet and build
        run: scripts/check.sh --stage native
      - name: Pinned dependency regressions
        run: scripts/check.sh --stage dependencies
      - name: Independent example consumers
        run: scripts/check.sh --stage examples
      - name: Offscreen routing and integration
        run: scripts/check.sh --stage offscreen
      - name: Existing offscreen benchmarks
        run: scripts/benchmark.sh
      - name: Check optional cache save budget
        id: cache-budget
        if: success() && steps.go-cache.outputs.cache-hit != 'true'
        run: python3 -B scripts/ci-cache-budget.py "$VELLUM_CI_STARTED" 60 >> "$GITHUB_OUTPUT"
      - name: Save verified downloads and Go build cache
        if: success() && steps.cache-budget.outputs.save == 'true'
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ runner.temp }}/vellum-go-cache/mod/cache/download
            ${{ runner.temp }}/vellum-go-cache/build
          key: ${{ steps.go-cache.outputs.cache-primary-key }}

  sdk-consumers:
    # Separate from the long framework job; no desktop/runtime execution.
    runs-on: macos-15
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - name: Record job start for optional cache budget
        run: echo "VELLUM_CI_STARTED=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - run: echo "VELLUM_CACHE_DIR=$RUNNER_TEMP/vellum-sdk-cache" >> "$GITHUB_ENV"
      - name: Restore verified downloads and Go build cache
        id: go-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ runner.temp }}/vellum-sdk-cache/mod/cache/download
            ${{ runner.temp }}/vellum-sdk-cache/build
          key: vellum-sdk-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/go.mod', '**/go.sum', 'drivers/cogent/native/dependencies.json', 'release/native-patch-inventory.json') }}-${{ github.sha }}
          restore-keys: |
            vellum-sdk-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/go.mod', '**/go.sum', 'drivers/cogent/native/dependencies.json', 'release/native-patch-inventory.json') }}-
      - name: Rebuild and verify pinned native sources
        run: drivers/cogent/prepare.sh
      - name: Verify downloaded module contents
        shell: bash
        run: |
          . ./drivers/cogent/env.sh
          go mod verify
          (cd drivers/cogent && go mod verify)
      - name: Export and verify relocated SDK consumers
        shell: bash
        run: |
          . ./drivers/cogent/env.sh
          python3 -B scripts/check-sdk-ci.py --output "$RUNNER_TEMP/vellum-sdk-consumers"
      - name: Retain SDK consumer verification and failure logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sdk-consumer-check
          path: |
            ${{ runner.temp }}/vellum-sdk-consumers/relocation.json
            ${{ runner.temp }}/vellum-sdk-consumers/*.stdout
            ${{ runner.temp }}/vellum-sdk-consumers/*.stderr
          if-no-files-found: ignore
          retention-days: 7
      - name: Check optional cache save budget
        id: cache-budget
        if: success() && steps.go-cache.outputs.cache-hit != 'true'
        run: python3 -B scripts/ci-cache-budget.py "$VELLUM_CI_STARTED" 35 >> "$GITHUB_OUTPUT"
      - name: Save verified downloads and Go build cache
        if: success() && steps.cache-budget.outputs.save == 'true'
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ runner.temp }}/vellum-sdk-cache/mod/cache/download
            ${{ runner.temp }}/vellum-sdk-cache/build
          key: ${{ steps.go-cache.outputs.cache-primary-key }}
