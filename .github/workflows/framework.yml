name: Framework
on: [push, pull_request]
jobs:
  framework:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: echo "VELLUM_CACHE_DIR=$RUNNER_TEMP/vellum-go-cache" >> "$GITHUB_ENV"
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - run: drivers/cogent/prepare.sh
      - run: scripts/check.sh
      - run: scripts/benchmark.sh
